# Versions partagées par tous les dépôts CubixMC v2 (même fichier dans chaque dépôt).
# Renovate les met à jour ; garder les trois copies identiques.

[versions]
java = "25"
minestom = "2026.10.07-26.2"
velocity = "4.3.1"
adventure = "5.2.0"
gson = "2.14.0"
slf4j = "2.0.20"
logback = "1.6.7"
jspecify = "1.0.1"
errorprone = "2.52.0"
nullaway = "0.14.3"
junit = "6.1.3"
assertj = "3.27.7"
jedis = "8.0.2"
hikari = "7.1.0"
mariadb = "3.5.11"
flyway = "13.12.2"
palantir-java-format = "2.103.0"
testcontainers = "2.0.5"
# renovate: datasource=github-releases depName=ViaVersion/ViaVersion
viaversion = "5.12.2"
# renovate: datasource=github-releases depName=ViaVersion/ViaBackwards
viabackwards = "5.12.2"

[libraries]
minestom = { module = "net.minestom:minestom", version.ref = "minestom" }
minestom-testing = { module = "net.minestom:testing", version.ref = "minestom" }
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity" }
adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure" }
adventure-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }
adventure-plain = { module = "net.kyori:adventure-text-serializer-plain", version.ref = "adventure" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
jedis = { module = "redis.clients:jedis", version.ref = "jedis" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
mariadb = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-mysql = { module = "org.flywaydb:flyway-mysql", version.ref = "flyway" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers" }
testcontainers-mariadb = { module = "org.testcontainers:testcontainers-mariadb", version.ref = "testcontainers" }

# Plugins Gradle utilisés par build-logic (artefacts, pas des alias de plugins)
gradle-errorprone = { module = "net.ltgt.gradle:gradle-errorprone-plugin", version = "5.2.0" }
gradle-spotless = { module = "com.diffplug.spotless:spotless-plugin-gradle", version = "8.11.0" }

[plugins]
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
maven-publish = { id = "com.vanniktech.maven.publish", version = "0.37.0" }
foojay = { id = "org.gradle.toolchains.foojay-resolver-convention", version = "1.0.0" }
